<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 180px;
      margin: 0;
      padding: 12px;
      background-color: #0A1628; /* Deep dark blue */
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 4px;
    }
    .title-group {
      display: flex;
      flex-direction: column;
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      margin: 0;
      color: #ffffff;
      line-height: 1.1;
    }
    .subtitle {
      font-size: 10px;
      color: #8da1bc;
      margin-top: 2px;
    }
    .control-card {
      background-color: #13294B; /* Illini Blue */
      border: 1px solid #233b62;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status {
      font-size: 12px;
      font-weight: 600;
      color: #8da1bc;
      transition: color 0.3s;
    }
    .status.active {
      color: #E84A27; /* Illini Orange */
    }
    /* Custom Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #0A1628;
      border-radius: 20px;
      transition: 0.3s;
      border: 1px solid #233b62;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background-color: #8da1bc;
      border-radius: 50%;
      transition: 0.3s;
    }
    input:checked + .slider {
      background-color: #E84A27; /* Illini Orange */
      border-color: #E84A27;
    }
    input:checked + .slider:before {
      transform: translateX(16px);
      background-color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="header">
    <!-- Automatically fetches the favicon from your club's site -->
    <img src="https://www.google.com/s2/favicons?domain=gtoillini.com&sz=64" alt="GTO Illini" class="logo">
    <div class="title-group">
      <div class="title">AutoShow</div>
      <div class="subtitle">for PokerNow</div>
    </div>
  </div>

  <div class="control-card">
    <span class="status" id="statusText">Off</span>
    <label class="switch">
      <input type="checkbox" id="toggleSwitch">
      <span class="slider"></span>
    </label>
  </div>

  <script src="popup.js"></script>
</body>
</html>
